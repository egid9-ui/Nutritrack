
<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Nutritrack</title>
<style>
:root{--bg:#0b1018;--card:#151d29;--blue:#4e9bff;--text:#f4f7fb;--muted:#8c9aab}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,sans-serif}
header{padding:25px 20px;background:#111a27;border-bottom:1px solid #283447}
header h1{margin:0;color:var(--blue);font-size:27px}
header p{margin:6px 0 0;color:var(--muted)}
main{max-width:650px;margin:auto;padding:16px}
.card{background:var(--card);border:1px solid #263346;border-radius:16px;padding:16px;margin-bottom:15px}
h2{font-size:18px;margin:0 0 15px}
h3{font-size:15px;margin:15px 0 8px}
input,select,button{font:inherit;border-radius:10px;padding:12px;border:1px solid #34445b;background:#0d1520;color:white}
input,select{width:100%;margin:5px 0}
button{background:var(--blue);color:#07111f;font-weight:700;border:0;cursor:pointer}
button.secondary{background:#253348;color:white}
.row{display:flex;gap:8px;align-items:center}
.row>*{flex:1}
.metric{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.metric div{background:#0d1520;padding:14px;border-radius:12px}
.metric strong{font-size:23px;display:block;margin-top:5px}
.small{color:var(--muted);font-size:12px}
.bar{height:8px;background:#293649;border-radius:8px;overflow:hidden;margin-top:8px}
.bar span{display:block;height:100%;background:var(--blue);width:0}
.food{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid #263346;gap:10px}
.food:last-child{border:0}
.food button{padding:9px 13px}
.tabs{display:flex;gap:8px;margin-bottom:15px}
.tabs button{flex:1}
.item{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid #263346}
.item button{padding:5px 10px;background:#a43e4a;color:white}
footer{text-align:center;color:var(--muted);padding:20px}
</style>
</head>
<body>
<header>
<h1>Nutritrack</h1>
<p>Ton alimentation. Tes objectifs. Tes résultats.</p>
</header>
<main>
<div class="card">
<h2>🎯 Objectifs quotidiens</h2>
<div class="row">
<div><label class="small">Calories</label><input id="goalCal" type="number" value="2200"></div>
<div><label class="small">Protéines (g)</label><input id="goalP" type="number" value="170"></div>
</div>
<button onclick="saveGoals()">Enregistrer les objectifs</button>
</div>

<div class="card">
<h2>📊 Aujourd'hui</h2>
<div class="metric">
<div>Calories<strong id="cal">0</strong><span class="small">kcal consommées</span><div class="bar"><span id="barCal"></span></div></div>
<div>Protéines<strong id="p">0 g</strong><span class="small">Objectif protéines</span><div class="bar"><span id="barP"></span></div></div>
<div>Glucides<strong id="c">0 g</strong></div>
<div>Lipides<strong id="f">0 g</strong></div>
</div>
<p id="remaining" class="small"></p>
</div>

<div class="card">
<h2>🍎 Ajouter un aliment</h2>
<input id="search" placeholder="Rechercher : banane, poulet, riz..." oninput="renderFoods()">
<div id="foods"></div>
<h3>Aliment personnalisé (pour 100 g)</h3>
<input id="customName" placeholder="Nom de l'aliment">
<div class="row">
<input id="customCal" type="number" placeholder="kcal">
<input id="customP" type="number" placeholder="Protéines">
</div>
<div class="row">
<input id="customC" type="number" placeholder="Glucides">
<input id="customF" type="number" placeholder="Lipides">
</div>
<button onclick="addCustom()">Créer l'aliment</button>
</div>

<div class="card">
<h2>🍽️ Journal alimentaire</h2>
<select id="meal">
<option>Petit-déjeuner</option>
<option>Déjeuner</option>
<option>Dîner</option>
<option>Collation</option>
</select>
<div id="journal"></div>
<button class="secondary" onclick="clearDay()">Effacer la journée</button>
</div>
</main>
<footer>Nutritrack · Version 1.0</footer>

<script>
const baseFoods=[
["Banane",89,1.1,22.8,.3],
["Pomme",52,.3,14,.2],
["Orange",47,.9,11.8,.1],
["Fraise",32,.7,7.7,.3],
["Avocat",160,2,8.5,14.7],
["Riz blanc cuit",130,2.7,28,.3],
["Pâtes cuites",158,5.8,30.9,.9],
["Pomme de terre",87,1.9,20.1,.1],
["Flocons d'avoine",370,13.5,58.7,7],
["Pain complet",247,13,41,4.2],
["Œuf",143,12.6,.7,9.5],
["Blanc d'œuf",52,11,0,.2],
["Poulet cuit",165,31,0,3.6],
["Dinde cuite",135,29,0,1],
["Bœuf 5% MG",137,21,0,5],
["Steak haché 15%",215,18,0,15],
["Saumon",208,20,0,13],
["Thon naturel",116,26,0,1],
["Cabillaud",82,18,0,.7],
["Crevettes",99,24,0,.3],
["Skyr nature",63,11,4,.2],
["Fromage blanc 0%",45,8,4,.2],
["Yaourt grec",97,9,4,5],
["Lait demi-écrémé",46,3.3,4.8,1.5],
["Whey",400,80,8,6],
["Amandes",579,21,22,50],
["Beurre de cacahuète",588,25,20,50],
["Chocolat noir",600,8,35,43],
["Huile d'olive",884,0,0,100],
["Brocoli",34,2.8,7,0.4],
["Haricots verts",31,1.8,7,0.2],
["Tomate",18,.9,3.9,.2],
["Salade",15,1.4,2.9,.2],
["Carotte",41,.9,9.6,.2],
["Courgette",17,1.2,3.1,.3],
["Melon",34,.8,8.2,.2],
["Pizza",266,11,33,10],
["Croissant",406,8,45,21],
["Brioche",360,9,55,12],
["Frites",312,3.4,41,15],
["Burger",250,14,25,11]
].map(x=>({name:x[0],cal:x[1],p:x[2],c:x[3],f:x[4]}));

let foods=[...baseFoods];
let journal=JSON.parse(localStorage.getItem("ntJournal")||"[]");
let goals=JSON.parse(localStorage.getItem("ntGoals")||'{"cal":2200,"p":170}');

goalCal.value=goals.cal;
goalP.value=goals.p;

function save(){
localStorage.setItem("ntJournal",JSON.stringify(journal));
}
function saveGoals(){
goals={cal:+goalCal.value||2200,p:+goalP.value||170};
localStorage.setItem("ntGoals",JSON.stringify(goals));
update();
}
function renderFoods(){
let q=search.value.toLowerCase();
let list=foods.filter(x=>x.name.toLowerCase().includes(q)).slice(0,50);
foodsDiv.innerHTML=list.map((x,i)=>`<div class="food"><div><b>${x.name}</b><div class="small">${x.cal} kcal · P ${x.p}g · G ${x.c}g · L ${x.f}g /100g</div></div><button onclick="addFood(${foods.indexOf(x)})">+</button></div>`).join("")||"Aucun aliment trouvé.";
}
const foodsDiv=document.getElementById("foods");
function addFood(i){
let food=foods[i];
let grams=prompt("Quantité en grammes pour "+food.name,"100");
if(grams===null)return;
grams=Number(grams);
if(!grams||grams<=0)return alert("Quantité invalide");
journal.push({...food,grams,meal:meal.value,id:Date.now()});
save();update();
}
function addCustom(){
let name=customName.value.trim();
if(!name)return alert("Indique le nom de l'aliment");
let x={name,cal:+customCal.value||0,p:+customP.value||0,c:+customC.value||0,f:+customF.value||0};
foods.push(x);
customName.value="";customCal.value="";customP.value="";customC.value="";customF.value="";
renderFoods();
}
function removeItem(id){
journal=journal.filter(x=>x.id!==id);save();update();
}
function clearDay(){
if(confirm("Effacer tous les aliments de la journée ?")){journal=[];save();update();}
}
function update(){
let total={cal:0,p:0,c:0,f:0};
journal.forEach(x=>["cal","p","c","f"].forEach(k=>total[k]+=x[k]*x.grams/100));
cal.textContent=Math.round(total.cal);
p.textContent=Math.round(total.p)+" g";
c.textContent=Math.round(total.c)+" g";
f.textContent=Math.round(total.f)+" g";
barCal.style.width=Math.min(100,total.cal/goals.cal*100)+"%";
barP.style.width=Math.min(100,total.p/goals.p*100)+"%";
remaining.textContent="Calories restantes : "+Math.round(goals.cal-total.cal)+" kcal · Protéines restantes : "+Math.round(goals.p-total.p)+" g";
journalDiv.innerHTML=["Petit-déjeuner","Déjeuner","Dîner","Collation"].map(m=>{
let items=journal.filter(x=>x.meal===m);
if(!items.length)return "";
return `<h3>${m}</h3>`+items.map(x=>`<div class="item"><div>${x.name} · ${x.grams}g <div class="small">${Math.round(x.cal*x.grams/100)} kcal</div></div><button onclick="removeItem(${x.id})">×</button></div>`).join("");
}).join("")||"Aucun aliment enregistré.";
}
const journalDiv=document.getElementById("journal");
renderFoods();update();
</script>
</body>
</html>
